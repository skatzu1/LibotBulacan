  <g transform="rotate(45 512 512)">
    <polygon points="512,184 578,446 840,512 578,578 512,840 446,578 184,512 446,446" fill="#FFFFFF"/>
  </g>
  <polygon points="512,41 599,425 983,512 599,599 512,983 425,599 41,512 425,425" fill="#FFFFFF"/>
  <polygon points="512,41 599,425 425,425" fill="#4FC3D6"/>
