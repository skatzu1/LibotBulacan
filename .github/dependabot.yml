version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # Expo pins React, React Native and its own modules to versions that match
    # the SDK. Move those with `npx expo install --fix` when upgrading the SDK,
    # never one at a time. Security fixes still arrive through Dependabot
    # security updates.
    ignore:
      - dependency-name: "expo"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "expo-*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@expo/*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@react-native-community/*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "jest-expo"
        update-types: ["version-update:semver-major"]
      # The AR engine. Pinned exactly: 2.58 added a storage permission that
      # broke the Android manifest merge. Upgrade by hand and test AR on a phone.
      - dependency-name: "@reactvision/react-viro"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
